<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>QuickNotes</h1>

    <button id="load-btn" type="button">Load notes</button>

    <p id="status" role="status"></p>

    <form id="note-form">
      <label for="title-input">Title</label>
      <input id="title-input" type="text" name="title" />

      <label for="body-input">Body</label>
      <textarea id="body-input" name="body"></textarea>

      <button id="submit-btn" type="submit">Save note</button>
    </form>

    <ul id="notes-list"></ul>

    <script src="api.js" defer></script>
  </body>
</html>
